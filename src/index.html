<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"
    />
    <title>Tower Building</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png" />
  </head>
  <body>
    <canvas id="canvas" class="hide"></canvas>
    <div class="content">
      <div class="landing hide">
        <div class="action-1">
          <img src="./assets/main-bible-title.png" class="title swing" />
        </div>
        <div class="action-2">
          <div class="mode-btn-row">
            <img src="./assets/old-tsmt-btn.png" class="mode-btn" data-mode="old" />
            <img src="./assets/new-tsmt-btn.png" class="mode-btn" data-mode="new" />
          </div>
        </div>
      </div>
      <div id="modal" class="modal hide">
        <div class="mask"></div>
        <div class="js-modal-content modal-content">
          <div class="main">
            <div class="container">
              <img src="./assets/main-modal-bg.png" class="bg" />
              <div class="modal-main">
                <div id="over-modal" class="hide js-modal-card">
                  <img src="./assets/main-modal-over.png" class="over-img" />
                  <div id="score" class="over-score font-wenxue"></div>
                  <div id="over-zero" class="hide">
                    <div class="tip">
                      <p>Try Again!</p>
                      <img
                        src="./assets/main-modal-again-b.png"
                        class="over-button-b js-reload"
                      /><img
                        src="./assets/main-modal-invite-b.png"
                        class="over-button-b js-invite"
                      /><img
                        src="./assets/main-modal-mode-b.png"
                        class="over-button-b js-mode-select"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="wxShare hide"><img src="./assets/main-share-icon.png" /></div>
    </div>
    <script src="./assets/zepto-1.1.6.min.js"></script>
  </body>
</html>
