<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,minimal-ui"
    />
    <title>Tower Building</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.png" />
  </head>
  <body>
    <canvas id="canvas" class="hide"></canvas>
    <div class="content">
      <div class="loading">
        <div class="main">
          <img src="./assets/main-loading.gif" />
          <div class="progress">
            <div class="title font-wenxue">0%</div>
            <div class="bar">
              <div class="sub"><div class="percent"></div></div>
            </div>
            <div class="text">Loading...</div>
          </div>
        </div>
      </div>
      <!-- 모드 선택 화면 -->
      <div class="mode-selection hide">
        <div class="mode-content">
          <div class="mode-title">
            <h1 class="font-wenxue">성경 타워 게임</h1>
            <p class="mode-subtitle">모드를 선택하세요</p>
          </div>
          <div class="mode-buttons">
            <div class="mode-button" id="old-testament-btn" data-mode="old">
              <div class="mode-icon">📜</div>
              <h3>구약 성경</h3>
              <p>39권의 구약 성경으로<br />타워를 쌓아보세요</p>
              <div class="mode-books-count">39권</div>
            </div>
            <div class="mode-button" id="new-testament-btn" data-mode="new">
              <div class="mode-icon">✝️</div>
              <h3>신약 성경</h3>
              <p>27권의 신약 성경으로<br />타워를 쌓아보세요</p>
              <div class="mode-books-count">27권</div>
            </div>
          </div>
        </div>
      </div>

      <div class="landing hide">
        <div class="action-1">
          <img src="./assets/main-bible-title.png" class="title swing" />
        </div>
        <div class="action-2">
          <img id="start" src="./assets/main-index-start.png" class="start" />
        </div>
      </div>
      <div id="modal" class="modal hide">
        <div class="mask"></div>
        <div class="js-modal-content modal-content">
          <div class="main">
            <div class="container">
              <img src="./assets/main-modal-bg.png" class="bg" />
              <div class="modal-main">
                <div id="over-modal" class="hide js-modal-card">
                  <img src="./assets/main-modal-over.png" class="over-img" />
                  <div id="score" class="over-score font-wenxue"></div>
                  <div id="over-zero" class="hide">
                    <div class="tip">
                      <p>Try Again!</p>
                      <img
                        src="./assets/main-modal-again-b.png"
                        class="over-button-b js-reload"
                      /><img
                        src="./assets/main-modal-invite-b.png"
                        class="over-button-b js-invite"
                      /><img
                        src="./assets/main-modal-mode-b.png"
                        class="over-button-b js-mode-select"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="wxShare hide"><img src="./assets/main-share-icon.png" /></div>
    </div>
    <script src="./assets/zepto-1.1.6.min.js"></script>
  </body>
</html>
